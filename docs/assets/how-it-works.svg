<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
  <title id="t">How Code Alarm works</title>
  <desc id="d">On your computer, an armed agent (Claude Code or Codex) runs code-alarm's hooks. When the work finishes, stops, fails or needs you, code-alarm sends one small event, its kind, the folder's name, the agent and two timestamps, through the Code Alarm relay or ntfy to your phone, which rings like an alarm. Prompts, code, file paths and transcripts stay on the computer.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E8364F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#FF7A45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF7A45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="480" rx="24"/></clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#FF7A45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="clock" viewBox="0 0 128 128">
      <g transform="translate(0 -6.25)">
        <path d="M24 53 A24 24 0 0 1 48 29 Z" fill="#FFFFFF"/>
        <path d="M80 29 A24 24 0 0 1 104 53 Z" fill="#FFFFFF"/>
        <path d="M41 97 L33 108 M87 97 L95 108" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
        <circle cx="64" cy="70" r="35" fill="#FFFFFF"/>
        <path d="M47 59 L59 70 L47 81" fill="none" stroke="#E8364F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M65 82 H81" fill="none" stroke="#E8364F" stroke-width="7" stroke-linecap="round"/>
      </g>
    </symbol>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .node { fill: #1A1C22; stroke: #2C2F38; }
      .title { font-size: 21px; font-weight: 700; fill: #F2F3F5; }
      .sub { font-size: 15px; fill: #9EA2AF; }
      .step { font-size: 13px; fill: #5D6170; letter-spacing: 1px; }
      .tile { fill: #252831; stroke: #343844; }
      .flow { stroke-dasharray: 5 7; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="480" fill="#111216"/>
    <rect width="1200" height="480" fill="url(#dots)"/>
    <rect width="1200" height="480" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Your computer: everything inside stays here -->
  <rect x="32" y="40" width="568" height="336" rx="20" fill="#FFFFFF" fill-opacity="0.015" stroke="#4A4E5C" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="60" y="76" class="sans" font-size="13" font-weight="700" fill="#8A8E9C" letter-spacing="2">ON YOUR COMPUTER</text>
  <g transform="translate(60 340)">
    <rect x="0" y="-12" width="14" height="11" rx="2.5" fill="#3FCB7E"/>
    <path d="M3.2 -12 V-15.5 A3.8 3.8 0 0 1 10.8 -15.5 V-12" fill="none" stroke="#3FCB7E" stroke-width="2"/>
    <text x="24" y="-1" class="sans" font-size="15" fill="#B9BCC6">Prompts, code, file paths and transcripts never leave this box.</text>
  </g>

  <!-- 1. The agent -->
  <rect x="56" y="100" width="236" height="208" rx="16" class="node"/>
  <text x="268" y="128" text-anchor="end" class="mono step">01</text>
  <rect x="80" y="124" width="52" height="44" rx="10" class="tile"/>
  <path d="M93 137 L102 146 L93 155" fill="none" stroke="#E6E7EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 156 H119" stroke="#E6E7EB" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="214" class="sans title">Your agent</text>
  <text x="80" y="244" class="sans sub">Claude Code or Codex,</text>
  <text x="80" y="266" class="sans sub">armed with</text>
  <text x="80" y="290" class="mono" font-size="14" fill="#FF9A66">/code-alarm:alarm</text>

  <!-- 2. code-alarm -->
  <rect x="340" y="100" width="236" height="208" rx="16" fill="#1C1A1E"/>
  <rect x="340.75" y="100.75" width="234.5" height="206.5" rx="15.25" fill="none" stroke="url(#brand)" stroke-width="1.5"/>
  <text x="552" y="128" text-anchor="end" class="mono step">02</text>
  <rect x="364" y="120" width="52" height="52" rx="12" fill="url(#brand)"/>
  <use href="#clock" x="368" y="124" width="44" height="44"/>
  <text x="364" y="214" class="mono" font-size="20" font-weight="700" fill="#F2F3F5">code-alarm</text>
  <text x="364" y="244" class="sans sub">Its hooks see the work finish,</text>
  <text x="364" y="266" class="sans sub">stop, fail or wait for you.</text>

  <!-- 3. Relay -->
  <rect x="668" y="100" width="236" height="208" rx="16" class="node"/>
  <text x="880" y="128" text-anchor="end" class="mono step">03</text>
  <rect x="692" y="124" width="52" height="44" rx="10" class="tile"/>
  <circle cx="718" cy="146" r="4" fill="#E6E7EB"/>
  <path d="M709 137 A13 13 0 0 0 709 155 M727 137 A13 13 0 0 1 727 155" fill="none" stroke="#E6E7EB" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M703 132 A20 20 0 0 0 703 160 M733 132 A20 20 0 0 1 733 160" fill="none" stroke="#7D8190" stroke-width="2.5" stroke-linecap="round"/>
  <text x="692" y="214" class="sans title">Relay or ntfy</text>
  <text x="692" y="244" class="sans sub">Passes the event on as a</text>
  <text x="692" y="266" class="sans sub">high-priority push.</text>

  <!-- 4. Phone -->
  <rect x="940" y="100" width="236" height="208" rx="16" class="node"/>
  <text x="1152" y="128" text-anchor="end" class="mono step">04</text>
  <rect x="964" y="124" width="52" height="44" rx="10" class="tile"/>
  <rect x="981" y="129" width="18" height="34" rx="4" fill="none" stroke="#E6E7EB" stroke-width="2.5"/>
  <path d="M974 139 A10 10 0 0 0 974 153 M1006 139 A10 10 0 0 1 1006 153" fill="none" stroke="#FF7A45" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <text x="964" y="214" class="sans title">Your phone</text>
  <text x="964" y="244" class="sans sub">Rings like an alarm, not</text>
  <text x="964" y="266" class="sans sub">a quiet notification.</text>

  <!-- Arrows -->
  <path d="M296 204 H332" stroke="#FF7A45" stroke-width="2.5" fill="none" class="flow" marker-end="url(#head)"/>
  <path d="M580 204 H660" stroke="#FF7A45" stroke-width="2.5" fill="none" class="flow" marker-end="url(#head)"/>
  <path d="M908 204 H932" stroke="#FF7A45" stroke-width="2.5" fill="none" class="flow" marker-end="url(#head)"/>

  <!-- The whole alert -->
  <path d="M620 204 V412 H640" stroke="#4A4E5C" stroke-width="1.5" fill="none" stroke-dasharray="3 5"/>
  <circle cx="620" cy="204" r="4" fill="#FF7A45"/>
  <rect x="640" y="364" width="536" height="88" rx="14" fill="#16171C" stroke="#2C2F38"/>
  <text x="664" y="394" class="sans" font-size="13" font-weight="700" fill="#8A8E9C" letter-spacing="2">THE WHOLE ALERT</text>
  <text x="664" y="428" class="mono" font-size="15" fill="#9EA2AF">{<tspan fill="#7AA2F7">"kind"</tspan>:<tspan fill="#3FCB7E">"done"</tspan>, <tspan fill="#7AA2F7">"label"</tspan>:<tspan fill="#3FCB7E">"web-app"</tspan>, <tspan fill="#7AA2F7">"agent"</tspan>:<tspan fill="#3FCB7E">"claude-code"</tspan>, …}</text>
</svg>
